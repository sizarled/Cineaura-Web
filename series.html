<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="js/prefs.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n-title="common.series">Series — CineAura</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d253f'/%3E%3Cpolygon points='26,18 48,32 26,46' fill='%2390cea1'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/prize.css" />
  <link rel="stylesheet" href="css/browse.css" />
  <link rel="stylesheet" href="css/facebook.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="page-inner" data-kind="tv">
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-cyan"></div>
    <div class="orb orb-green"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="site-wrap">
    <header class="header scrolled" id="site-header">
      <div class="header-inner">
        <a class="logo" href="./">
          <span class="logo-mark" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 2.5L13 8L4 13.5V2.5Z" fill="#90cea1"/></svg>
          </span>
          <span class="logo-word">Cine<span>Aura</span></span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="./movies.html" data-i18n="nav.movies">Movies</a>
          <a href="./series.html" data-i18n="nav.series">Series</a>
          <a href="./#iptv" data-i18n="nav.iptv">IPTV</a>
          <a href="./Prize.html" data-i18n="nav.prizes">Prizes</a>
          <a href="./#plans" data-i18n="nav.plansShort">Plans</a>
        </nav>
        <div class="auth auth-guest" id="auth-guest">
          <a class="btn btn-sm btn-ghost" href="./login.html" data-i18n="nav.signin">Sign In</a>
          <a class="btn btn-sm btn-primary" href="./register.html" data-i18n="nav.signup">Sign Up</a>
        </div>
        <div class="auth auth-user" id="auth-user">
          <div class="header-bell-wrap">
            <button class="header-bell-btn" id="header-bell-btn" type="button" aria-label="Notifications" data-i18n-aria="prof.notif">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="header-bell-dot" id="header-bell-dot" hidden></span>
            </button>
            <div class="glass header-bell-panel" id="header-bell-panel" hidden></div>
          </div>
          <a class="btn btn-sm btn-primary" href="./dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
          <button class="btn btn-sm btn-danger" id="logout-btn" type="button" data-i18n="nav.logout">Log Out</button>
        </div>
        <button class="hamburger" id="hamburger" type="button" data-i18n-aria="nav.openMenu" aria-label="Open menu"><span></span><span></span><span></span></button>
      </div>
    </header>
    <div class="mobile-menu" id="mobile-menu">
      <a href="./login.html" data-i18n="nav.signin">Sign In</a>
      <a href="./register.html" data-i18n="nav.signup">Sign Up</a>
      <a href="./dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
      <div class="mobile-auth-user"><button type="button" data-logout data-i18n="nav.logout">Log Out</button></div>
    </div>
    <main class="page-main" id="browse-root">
      <div class="br-wrap">
        <header class="br-head">
          <span class="eyebrow" data-i18n="browse.kicker">Browse</span>
          <h1 data-i18n="common.series">Series</h1>
          <p class="muted" data-i18n="browse.lead">Search by title, actor or director, then filter by genre, rating and year.</p>
        </header>
        <div class="pz-toolbar br-toolbar glass" id="br-toolbar" role="search">
          <label class="pz-field pz-field-search">
            <span class="pz-field-label" data-i18n="nav.search">Search</span>
            <input id="br-q" type="search" autocomplete="off" data-i18n-placeholder="browse.searchPh" placeholder="Search by title, actor or director…" />
          </label>
          <label class="pz-field">
            <span class="pz-field-label" data-i18n="browse.genre">Genre</span>
            <select id="br-genre"><option value="" data-i18n="browse.allGenres">All genres</option></select>
          </label>
          <label class="pz-field">
            <span class="pz-field-label" data-i18n="browse.rating">Rating</span>
            <select id="br-rating"><option value="" data-i18n="browse.anyRating">Any rating</option></select>
          </label>
          <label class="pz-field">
            <span class="pz-field-label" data-i18n="browse.year">Year</span>
            <select id="br-year"><option value="" data-i18n="browse.allYears">All years</option></select>
          </label>
          <label class="pz-field">
            <span class="pz-field-label" data-i18n="browse.sort">Sort by</span>
            <select id="br-sort">
              <option value="pop_desc" data-i18n="browse.sortPopDesc">Most popular first</option>
              <option value="pop_asc" data-i18n="browse.sortPopAsc">Least popular first</option>
              <option value="rating_desc" data-i18n="browse.sortRatingDesc">Highest rated first</option>
              <option value="rating_asc" data-i18n="browse.sortRatingAsc">Lowest rated first</option>
              <option value="az" data-i18n="browse.sortAz">Title A → Z</option>
              <option value="za" data-i18n="browse.sortZa">Title Z → A</option>
              <option value="old" data-i18n="browse.sortOldest">Oldest first</option>
              <option value="new" data-i18n="browse.sortNewest">Newest first</option>
            </select>
          </label>
        </div>
        <div class="pz-toolbar-meta br-meta">
          <span id="br-count" aria-live="polite"></span>
          <button class="btn btn-sm btn-ghost" id="br-reset" type="button" data-i18n="browse.reset">Reset filters</button>
        </div>
        <div id="br-person"></div>
        <div class="br-grid" id="br-results" aria-live="polite"></div>
        <nav class="br-pager" id="br-pager" aria-label="Pages"></nav>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/i18n.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/common.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
