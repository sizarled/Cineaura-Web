<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="js/prefs.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n-title="common.channelsTitle">Channels — CineAura</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/facebook.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body class="page-inner">
  <div class="bg-orbs" aria-hidden="true"><div class="orb orb-cyan"></div></div>
  <div class="site-wrap">
    <header class="header scrolled" id="site-header">
      <div class="header-inner">
        <a class="logo" href="./"><span class="logo-word">Cine<span>Aura</span></span></a>
        <div class="auth auth-user" id="auth-user">
          <div class="header-bell-wrap">
            <button class="header-bell-btn" id="header-bell-btn" type="button" aria-label="Notifications" data-i18n-aria="prof.notif">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="header-bell-dot" id="header-bell-dot" hidden></span>
            </button>
            <div class="glass header-bell-panel" id="header-bell-panel" hidden></div>
          </div><a class="btn btn-sm btn-primary" href="./dashboard.html" data-i18n="nav.dashboard">Dashboard</a></div>
        <div class="auth auth-guest" id="auth-guest"><a class="btn btn-sm btn-ghost" href="./login.html" data-i18n="nav.signin">Sign In</a></div>
      </div>
    </header>
    <main class="page-main" id="root"></main>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const { setupChrome, supabaseRequest, restValue, escapeHtml } = CineAura;
      setupChrome();
      const pack = new URLSearchParams(location.search).get("package") || "";
      const root = document.getElementById("root");
      const res = await supabaseRequest(`/rest/v1/listchannels?package_name=eq.${restValue(pack)}&select=*&order=group_name.asc`);
      const rows = res.ok && Array.isArray(res.data) ? res.data : [];
      const groups = {};
      rows.forEach((r) => {
        groups[r.group_name || "General"] = groups[r.group_name || "General"] || [];
        groups[r.group_name || "General"].push(r);
      });
      root.innerHTML = `<section class="glass dash-main" style="width:min(900px,calc(100% - 40px));margin:0 auto">
        <p class="eyebrow">IPTV</p>
        <h1>${escapeHtml(pack || "Channels")}</h1>
        ${Object.keys(groups).length ? Object.entries(groups).map(([g, arr]) => `
          <h2 style="margin:18px 0 8px">${escapeHtml(g)}</h2>
          <div class="cards">${arr.map((c)=>`
            <article class="mini-card" style="display:flex;gap:10px;align-items:center">
              <img src="${escapeHtml(c.logo_url || "")}" alt="" style="width:42px;height:42px;object-fit:contain;background:#031a2d;border-radius:8px" onerror="this.style.opacity=0" />
              <div><strong>${escapeHtml(c.channel_name)}</strong><div class="muted">${escapeHtml(c.channel_type||"live")}</div></div>
            </article>`).join("")}</div>`).join("") : `<p class="empty">No channels in this package yet.</p>`}
      </section>`;
    });
  </script>
</body>
</html>
